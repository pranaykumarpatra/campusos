name: campusos

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: campusos
      POSTGRES_PASSWORD: campusos_dev
      POSTGRES_DB: campusos
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusos"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: campusos
      RABBITMQ_DEFAULT_PASS: campusos_dev
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI -> http://localhost:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/campusos
      KC_DB_USERNAME: campusos
      KC_DB_PASSWORD: campusos_dev
    ports:
      - "8080:8080"  # -> http://localhost:8080
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: campusos
      MINIO_ROOT_PASSWORD: campusos_dev
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console -> http://localhost:9001
    volumes:
      - minio_data:/data

volumes:
  pg_data:
  redis_data:
  rabbitmq_data:
  minio_data:
