name: CI

# Runs on every PR into master and on every push to master, so master never
# receives code that hasn't at least type-checked and built successfully.
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Type-check API
        run: npx tsc --noEmit
        working-directory: apps/api

      - name: Build API
        run: npm run build --workspace=api

      - name: Build web
        run: npm run build --workspace=web
